<svg width="100%" viewBox="0 0 700 310" xmlns="http://www.w3.org/2000/svg" role="img">
<title>RecoveryStrategy interface and its three implementations</title>
<rect x="0" y="0" width="700" height="310" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="125" y1="190" x2="350" y2="124" stroke="#6366f1" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line x1="350" y1="190" x2="350" y2="124" stroke="#6366f1" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line x1="575" y1="190" x2="350" y2="124" stroke="#6366f1" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

<rect x="220" y="24" width="260" height="100" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
<text x="350" y="46" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#312e81">RecoveryStrategy</text>
<line x1="230" y1="58" x2="470" y2="58" stroke="#6366f1" stroke-width="0.75" opacity="0.4"/>
<text x="350" y="78" text-anchor="middle" font-family="monospace" font-size="12" fill="#3730a3">plan(graph, demands) → Plan</text>
<text x="350" y="98" text-anchor="middle" font-family="monospace" font-size="12" fill="#3730a3">react(plan, failure) → Reaction</text>

<rect x="30" y="190" width="190" height="56" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
<text x="125" y="212" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#065f46">SBPP</text>
<text x="125" y="232" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#047857">Shared spare capacity</text>

<rect x="255" y="190" width="190" height="56" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
<text x="350" y="212" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#065f46">Fast reroute</text>
<text x="350" y="232" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#047857">Local link bypass</text>

<rect x="480" y="190" width="190" height="56" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
<text x="575" y="212" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#065f46">Global recompute</text>
<text x="575" y="232" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#047857">Online MILP resolve</text>

<text x="350" y="278" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#57606a">Plan and Reaction are the data objects passed between plan() and react()</text>
</svg>
