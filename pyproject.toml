[project]
name = "net-restoration-bench"
version = "0.0.1"
description = "Benchmark of SDN link-failure recovery strategies: SBPP, Fast Reroute and global MILP recompute"
requires-python = ">=3.9"
dependencies = [
    "networkx>=3",
    "pulp>=2.8",
    "pandas>=2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
